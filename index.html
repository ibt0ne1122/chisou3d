<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D土地模型｜大地のつくり</title>
<style>
  :root { --bg:#eef4f7; --panel:#fff; --ink:#1f2a33; --sub:#5a6873; --accent:#1f7a8c; }
  body { margin:0; font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif; background:var(--bg); color:var(--ink); line-height:1.7; }
  main { max-width:760px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:26px; margin:0 0 4px; }
  p.lead { color:var(--sub); margin:0 0 24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
  .card { display:flex; flex-direction:column; gap:4px; background:var(--panel); border-radius:14px; padding:18px; text-decoration:none; color:inherit; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  .card:hover { outline:3px solid var(--accent); }
  .card .ic { font-size:28px; } .card b { font-size:18px; } .card small { color:var(--accent); }
  footer { margin-top:32px; font-size:13px; color:var(--sub); }
  footer a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>🌋 3D土地模型（6年理科「大地のつくり」）</h1>
  <p class="lead">学校のまわりの地形と、地面の下の地層を3Dで見られます。見たい場所をえらんでください。</p>
  <div class="grid">
    <a class="card" href="app.html?site=nagatsuta"><span class="ic">🏫</span><b>長津田小学校のまわり</b><small>3D土地模型をひらく ›</small></a>
    <a class="card" href="app.html?site=shinoharanishi"><span class="ic">🏫</span><b>篠原西小学校のまわり</b><small>3D土地模型をひらく ›</small></a>
  </div>
  <footer>
    <p>パソコン・タブレット（Edge・Chrome・Safari）で動きます。インターネットにつながっている必要があります。</p>
    <p>出典：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院（地理院タイル・標高タイル）</a>／
    ボーリング柱状図：<a href="https://publicweb.ngic.or.jp/public/publicweb.php" target="_blank" rel="noopener">国土地盤情報データベース（国土地盤情報センター）</a>／
    谷戸：<a href="https://yato.midoriit.com/" target="_blank" rel="noopener">谷戸のヨコハマ</a>。地下の地層は、ボーリング資料からの推定です。</p>
  </footer>
</main>
</body>
</html>
